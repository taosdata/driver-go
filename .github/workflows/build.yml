name: Go

on:
  pull_request:
    branches:
      - 'main'
      - '3.0'
      - '3.1'
  push:
    branches:
      - 'main'
      - '3.0'
      - '3.1'
  workflow_dispatch:
    inputs:
      tbBranch:
        description: 'TDengine branch'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Setup TDengine nightly
        uses: ./.github/actions/setup-tdengine
        with:
          mode: 'nightly'
          branch: ${{ steps.get-branch.outputs.branch }}
          start-services: 'true'
          nightly-url: ${{ secrets.NIGHTLY_TDENGINE_ENTERPRISE_BASE_URL }}


  test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        go: ['1.14', '1.17', '1.22', 'stable']
        include:
          - go: '1.14'
            coverage_flag: ''
          - go: '1.17'
            coverage_flag: ''
          - go: '1.22'
            coverage_flag: ''
          - go: 'stable'
            coverage_flag: '-coverpkg=./...'
    name: Test Go ${{ matrix.go }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup TDengine nightly
        uses: ./.github/actions/setup-tdengine
        with:
          mode: 'nightly'
          branch: ${{ steps.get-branch.outputs.branch }}
          start-services: 'true'
          nightly-url: ${{ secrets.NIGHTLY_TDENGINE_ENTERPRISE_BASE_URL }}
          
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum

      - name: Run tests
        env:
          TDENGINE_CLOUD_ENDPOINT: ${{ secrets.TDENGINE_CLOUD_ENDPOINT }}
          TDENGINE_CLOUD_TOKEN: ${{ secrets.TDENGINE_CLOUD_TOKEN }}
        run: |
          go version
          go env
          packages="./..."
          if [ "${{ matrix.go }}" = "1.14" ] || [ "${{ matrix.go }}" = "1.17" ]; then
            packages="$(go list ./... | grep -v '^github.com/taosdata/driver-go/v3/examples/')"
          fi
          go test ${{ matrix.coverage_flag }} -v --count=1 -coverprofile=coverage.txt -covermode=atomic $packages

      - name: Upload coverage
        if: matrix.go == 'stable'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_ORG_TOKEN }}

  docs-go:
    runs-on: ubuntu-latest
    needs: build
    name: Docs Go Examples
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup TDengine
        uses: ./.github/actions/setup-tdengine
        with:
          mode: 'build'
          commit-id: ${{ needs.build.outputs.commit_id }}
          event-key: ${{ needs.build.outputs.event_key }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Run go examples
        run: |
          sudo ./examples/go.sh

  race-test:
    runs-on: ubuntu-latest
    needs: build
    name: Race Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup TDengine
        uses: ./.github/actions/setup-tdengine
        with:
          mode: 'build'
          commit-id: ${{ needs.build.outputs.commit_id }}
          event-key: ${{ needs.build.outputs.event_key }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Run race tests
        env:
          TDENGINE_CLOUD_ENDPOINT: ${{ secrets.TDENGINE_CLOUD_ENDPOINT }}
          TDENGINE_CLOUD_TOKEN: ${{ secrets.TDENGINE_CLOUD_TOKEN }}
        run: |
          go version
          go env
          go test -race --count=1 ./ws/... ./taosWS

  ws-reliability:
    runs-on: ubuntu-latest
    needs: build
    name: WS Reliability Gate
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup TDengine
        uses: ./.github/actions/setup-tdengine
        with:
          mode: 'build'
          commit-id: ${{ needs.build.outputs.commit_id }}
          event-key: ${{ needs.build.outputs.event_key }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Run reliability gate
        run: |
          go version
          go env
          LOOP_COUNT=20 ./ws/reliability_gate.sh full

  ws-failover:
    runs-on: ubuntu-latest
    needs: build
    name: WS Failover Switch
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup TDengine
        uses: ./.github/actions/setup-tdengine
        with:
          mode: 'build'
          commit-id: ${{ needs.build.outputs.commit_id }}
          event-key: ${{ needs.build.outputs.event_key }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Run failover switch probe
        run: |
          sudo PROBE_TOTAL_SEC=20 PROBE_POST_SUCCESS=3 READY_TIMEOUT_SEC=20 bash ./ws/unified/tests/verify_failover_switch.sh

  test-asan:
    runs-on: ubuntu-latest
    needs: build
    name: Test with ASAN
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup TDengine
        uses: ./.github/actions/setup-tdengine
        with:
          mode: 'build'
          commit-id: ${{ needs.build.outputs.commit_id }}
          event-key: ${{ needs.build.outputs.event_key }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Run ASAN tests
        env:
          TDENGINE_CLOUD_ENDPOINT: ${{ secrets.TDENGINE_CLOUD_ENDPOINT }}
          TDENGINE_CLOUD_TOKEN: ${{ secrets.TDENGINE_CLOUD_TOKEN }}
        run: |
          go version
          go env
          go test -v -asan ./...

  lint:
    runs-on: ubuntu-latest
    needs: build
    name: Lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup TDengine
        uses: ./.github/actions/setup-tdengine
        with:
          mode: 'build'
          commit-id: ${{ needs.build.outputs.commit_id }}
          event-key: ${{ needs.build.outputs.event_key }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
